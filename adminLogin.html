<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/main.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>admin login</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="http://www.openlayers.org/api/OpenLayers.js"></script>
</head>
<body>

  <div id="header-root"></div>

  <main>
    <div class="container-fluid bg-custom vh-100 d-flex flex-column">
      <div class="myContainer">
        <section>
          <div class="form-wrapper" >
            <h3 class="text-center">Σύνδεση Admin</h3>
            <section class="text-center" id = "registerIdform">
              <span>Welcome back, Chief. Your work matters.</span>
            </section>
            <form id="loginForm" method="post" onsubmit="loginAdmin();return false;">
              <div class="sect">
                <label for="username">Admin name</label>
                <input type="text" class="form-control" id="username" name="username" required>
              </div>
              <br>
              <div class="sect">
                <label for="password">Κωδικός χρήστη</label>
                <div class="input-container">
                  <input type="password" class="form-control" id="password" name="password" required>
                  <button type="button" name="buttonPass" onclick="showPassword(this)">
                    <i class="fas fa-lock"></i>
                  </button>
                </div>
              </div>
              <br>
              <div class="sect">
                <button class = custom-btn type="submit">Σύνδεση</button>
              </div>
              <div class = "sect" id="ajaxContent">
              </div>
            </form>
          </div>
        </section>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>


<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="js/load_header.js"></script>
<script src="js/load_footer.js"></script>
<script src="js/form_script.js"></script>
<script src="js/ajax.js"></script>
</body>
</html>
